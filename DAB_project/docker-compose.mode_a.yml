# docker-compose.mode_a.yml  —  MODE A: Home / no hardware
#
# Starts all three ODR processes in separate containers.
# No USB device access — modulator writes IQ samples to /dev/null.
#
# Usage:
#   docker compose -f docker-compose.mode_a.yml up --build
#   docker compose -f docker-compose.mode_a.yml down

version: "3.9"

networks:
  dab_net:
    # Internal bridge network — all containers talk to each other over
    # this network using their service names as hostnames.
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # ENCODER  (x3 instances in one container — mirrors original start_encoder.sh)
  # ---------------------------------------------------------------------------
  encoder:
    build:
      context: ./encoder
    container_name: dab_encoder
    networks:
      - dab_net
    restart: unless-stopped
    # Each encoder pushes EDI/TCP to the mux container.
    # Docker Compose DNS resolves "mux" to the mux container's IP automatically.
    command: >
      sh -c "
        odr-audioenc -v http://sc6.radiocaroline.net:8040
          -c 2 -r 32000 -b 64 -e tcp://mux:10001 &
        sleep 1
        odr-audioenc -v http://studio.theflashonair.co.uk:8000/1.mp3
          -c 2 -r 32000 -b 64 -e tcp://mux:10002 &
        sleep 1
        odr-audioenc -v http://s2.xrad.io:8522
          -c 1 -r 32000 -b 64 -e tcp://mux:10003 &
        wait
      "
    depends_on:
      - mux

  # ---------------------------------------------------------------------------
  # MUX
  # ---------------------------------------------------------------------------
  mux:
    build:
      context: ./mux
    container_name: dab_mux
    networks:
      - dab_net
    restart: unless-stopped
    volumes:
      # Mount the host config file into the container read-only.
      # Edit configs/mode_a/test.mux on the host; no rebuild needed.
      - ./configs/mode_a/test.mux:/configs/test.mux:ro
    command: odr-dabmux /configs/test.mux
    ports:
      # Expose the management stats port to localhost on the host machine
      # so OpenNMS / nc / the stats script can reach it without entering
      # the container.
      - "127.0.0.1:12720:12720"
      # Expose the telnet remote control port
      - "127.0.0.1:12721:12721"

  # ---------------------------------------------------------------------------
  # MODULATOR
  # ---------------------------------------------------------------------------
  mod:
    build:
      context: ./mod
    container_name: dab_mod
    networks:
      - dab_net
    restart: unless-stopped
    volumes:
      - ./configs/mode_a/ports25_mod.ini:/configs/ports25_mod.ini:ro
    command: odr-dabmod -C /configs/ports25_mod.ini
    ports:
      # Expose mod remote control ports to localhost
      - "127.0.0.1:2120:2120"
      - "127.0.0.1:9400:9400"
    depends_on:
      - mux
