# ─── Access control ──────────────────────────────────────────────────────────
# Read-only community "public", accessible from anywhere on dab_net
rocommunity public

# ─── Agent address ───────────────────────────────────────────────────────────
# Listen on all interfaces inside the container (dab_net only, no host exposure)
agentAddress udp:161

# ─── System info ─────────────────────────────────────────────────────────────
sysLocation    Docker / dab_net
sysContact     DAB Lab
sysDescr       DAB Collector - ODR Stack Monitor
sysobjectid    .1.3.6.1.4.1.8072.1.3.2.99

# ─── Disable default MIB bloat ───────────────────────────────────────────────
view   systemonly  included   .1.3.6.1.2.1.1
view   systemonly  included   .1.3.6.1.2.1.25.1
view   systemonly  included   .1.3.6.1.4.1.8072.1.3.2

# ─── pass_persist registration ───────────────────────────────────────────────
# All DAB stats live under the NET-SNMP extend subtree
# OID: .1.3.6.1.4.1.8072.1.3.2  (NET-SNMP-EXTEND-MIB)
# We register our own subtree one level below that:
#   .1.3.6.1.4.1.8072.1.3.2.99  (dab custom)
pass_persist .1.3.6.1.4.1.8072.1.3.2.99 /usr/bin/python3 /collector/pass_persist.py
