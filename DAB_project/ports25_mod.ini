; ODR-DabMod configuration — Mode A (no hardware)
; Used by myself (Sebastian) when working from home without the USRP B200.
; The modulator runs the full pipeline but discards IQ output to /dev/null.

[remotecontrol]
; Enables the telnet remote control interface on port 2120.
; Used to query modulator parameters at runtime for monitoring.
telnet=1
telnetport=2120

; ZMQ remote control endpoint for machine-to-machine monitoring.
zmqctrl=1
zmqctrlendpoint=tcp://0.0.0.0:9400

[log]
; Sends log output to syslog — visible with journalctl.
syslog=1
; Also writes logs to a file in /tmp so any user can access it.
filelog=1
filename=/tmp/odr-dabmod.log

[input]
; Receives ETI frames from the mux container over EDI/TCP.
; "mux" resolves to the mux container via Docker's internal DNS.
transport=edi
source=tcp://mux:13000
edi_max_delay=100
max_frames_queued=200

[modulator]
; Gain mode 2 (VAR) — normalises to 4x standard deviation.
; Recommended for real-world use as it is based on the DAB standard.
gainmode=2
; DAB transmission mode 1 — used for most UK terrestrial DAB broadcasts.
mode=1
; Digital gain multiplied to each sample before output.
digital_gain=0.8
; Output sample rate — 2.048 MHz is the standard DAB rate, no resampling needed.
rate=2048000
dac_clk_rate=0

[firfilter]
; FIR filter disabled — can be enabled to improve spectral quality.
enabled=0

[output]
; File output — discards IQ samples to /dev/null in Mode A.
; Switch to "uhd" in Mode B to transmit via the USRP B200.
output=file

[fileoutput]
; Complex float format — standard IQ sample format.
format=complexf
; Discard all output in Mode A since there is no hardware to transmit with.
filename=/dev/null

[uhdoutput]
; UHD settings kept here for reference — not active in Mode A.
; These are used in Mode B when output=uhd is set above.
master_clock_rate=32768000
type=b200
txgain=92.5
channel=7D
refclk_source=internal
pps_source=none
behaviour_refclk_lock_lost=ignore
max_gps_holdover_time=0

[zmqoutput]
; ZMQ IQ output — disabled in Mode A.
; Uncomment to stream IQ samples to a GNU Radio or welle.io receiver.
; listen=tcp://*:54001
; socket_type=pub

[delaymanagement]
; Single transmitter setup — SFN synchronisation not needed.
synchronous=0
mutenotimestamps=0
offset=0.250000
