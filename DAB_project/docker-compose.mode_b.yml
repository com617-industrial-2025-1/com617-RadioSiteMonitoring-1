# docker-compose.mode_b.yml  —  MODE B: Demo day / USRP B200 hardware
#
# Identical to Mode A except the mod container gets:
#   - privileged: true          (required for UHD to access USB)
#   - devices: /dev/bus/usb     (passes the entire USB bus into the container)
#   - the Mode B ini file       (output=uhd instead of output=file)
#
# IMPORTANT — before starting:
#   1. Plug in the USRP B200 via USB 3.0
#   2. Run:  lsusb | grep Ettus
#      You should see something like:  Bus 001 Device 003: ID 2500:0020 Ettus Research LLC USRP B200
#   3. Then: docker compose -f docker-compose.mode_b.yml up --build
#
# Usage:
#   docker compose -f docker-compose.mode_b.yml up --build
#   docker compose -f docker-compose.mode_b.yml down

version: "3.9"

networks:
  dab_net:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # ENCODER  (identical to Mode A)
  # ---------------------------------------------------------------------------
  encoder:
    build:
      context: ./encoder
    container_name: dab_encoder
    networks:
      - dab_net
    restart: unless-stopped
    command: >
      sh -c "
        odr-audioenc -v http://sc6.radiocaroline.net:8040
          -c 2 -r 32000 -b 64 -e tcp://mux:10001 &
        sleep 1
        odr-audioenc -v http://studio.theflashonair.co.uk:8000/1.mp3
          -c 2 -r 32000 -b 64 -e tcp://mux:10002 &
        sleep 1
        odr-audioenc -v http://s2.xrad.io:8522
          -c 1 -r 32000 -b 64 -e tcp://mux:10003 &
        wait
      "
    depends_on:
      - mux

  # ---------------------------------------------------------------------------
  # MUX  (identical to Mode A)
  # ---------------------------------------------------------------------------
  mux:
    build:
      context: ./mux
    container_name: dab_mux
    networks:
      - dab_net
    restart: unless-stopped
    volumes:
      - ./configs/mode_b/test.mux:/configs/test.mux:ro
    command: odr-dabmux /configs/test.mux
    ports:
      - "127.0.0.1:12720:12720"
      - "127.0.0.1:12721:12721"

  # ---------------------------------------------------------------------------
  # MODULATOR  (key differences from Mode A are marked with <-- MODE B)
  # ---------------------------------------------------------------------------
  mod:
    build:
      context: ./mod
    container_name: dab_mod
    networks:
      - dab_net
    restart: unless-stopped
    volumes:
      - ./configs/mode_b/ports25_mod.ini:/configs/ports25_mod.ini:ro
    command: odr-dabmod -C /configs/ports25_mod.ini
    ports:
      - "127.0.0.1:2120:2120"
      - "127.0.0.1:9400:9400"

    # <-- MODE B: passes the full USB bus into the container so UHD can
    # find and program the USRP B200. The firmware was baked into the
    # image at build time by uhd_images_downloader so no internet access
    # is needed on demo day.
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb

    depends_on:
      - mux
