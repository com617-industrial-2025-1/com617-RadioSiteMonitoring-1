[remotecontrol]
telnet=1
telnetport=2120
zmqctrl=1
zmqctrlendpoint=tcp://0.0.0.0:9400

[log]
syslog=0
filelog=0
filename=/tmp/odr-dabmod.log

[input]
transport=edi
source=tcp://mux:13000
edi_max_delay=100
max_frames_queued=200

[modulator]
gainmode=2
mode=1
digital_gain=0.8
rate=2048000
dac_clk_rate=0

[firfilter]
enabled=0

[output]
output=file

[fileoutput]
format=complexf
filename=/dev/null

[delaymanagement]
synchronous=0
mutenotimestamps=0
offset=0.250000
