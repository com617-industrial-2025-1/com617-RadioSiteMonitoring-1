[remotecontrol]
telnet=1
telnetport=2120
zmqctrl=0
zmqctrlendpoint=tcp://127.0.0.1:9400

[log]
syslog=0
filelog=1
filename=/dev/null

[input]
transport=edi
source=tcp://mux:13000
edi_max_delay=100
max_frames_queued=200

[modulator]
gainmode=2
mode=1
digital_gain=0.8
rate=2048000
dac_clk_rate=0

[firfilter]
enabled=0

[output]
output=uhd

[uhdoutput]
device=serial=318892B
txgain=40
master_clock_rate=32000000
frequency=229072000
antena=TX/RX
refclk=internal
ppsource=none

[delaymanagement]
synchronous=0
mutenotimestamps=0
offset=0.250000
