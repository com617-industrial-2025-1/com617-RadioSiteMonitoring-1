; ODR-DabMod configuration — Mode B (USRP B200 hardware)
; Used by myself (Sebastian) on demo day with the USRP B200 connected via USB.
; The only difference from Mode A is output=uhd instead of output=file.

[remotecontrol]
; Enables the telnet remote control interface on port 2120.
telnet=1
telnetport=2120

; ZMQ remote control endpoint for machine-to-machine monitoring.
zmqctrl=1
zmqctrlendpoint=tcp://0.0.0.0:9400

[log]
; Sends log output to syslog — visible with journalctl.
syslog=1
; Also writes logs to a file in /tmp so any user can access it.
filelog=1
filename=/tmp/odr-dabmod.log

[input]
; Receives ETI frames from the mux container over EDI/TCP.
; "mux" resolves to the mux container via Docker's internal DNS.
transport=edi
source=tcp://mux:13000
edi_max_delay=100
max_frames_queued=200

[modulator]
; Gain mode 2 (VAR) — normalises to 4x standard deviation.
; Recommended for real-world use as it is based on the DAB standard.
gainmode=2
; DAB transmission mode 1 — used for most UK terrestrial DAB broadcasts.
mode=1
; Digital gain multiplied to each sample before output.
digital_gain=0.8
; Output sample rate — 2.048 MHz is the standard DAB rate, no resampling needed.
rate=2048000
dac_clk_rate=0

[firfilter]
; FIR filter disabled — can be enabled to improve spectral quality.
enabled=0

[output]
; UHD output — transmits IQ samples to the USRP B200 hardware.
output=uhd

[fileoutput]
; Not active in Mode B — kept here for quick switching back to Mode A.
format=complexf
filename=/dev/null

[uhdoutput]
; master_clock_rate must be a multiple of the sample rate.
; 32768000 = 16 x 2048000, which is the recommended ratio for the B200.
master_clock_rate=32768000
type=b200
; TX gain — the B200 supports 0 to 89.8 dB. Start lower if issues occur.
txgain=92.5
; Channel 7D = 194.064 MHz (DAB Band III).
; Only transmit on this frequency with a dummy load or in a shielded environment.
channel=7D
; Internal clock reference — accurate enough for a single transmitter demo.
refclk_source=internal
pps_source=none
behaviour_refclk_lock_lost=ignore
max_gps_holdover_time=0

[zmqoutput]
; ZMQ IQ output — disabled.
; Uncomment to stream IQ samples to a GNU Radio or welle.io receiver.
; listen=tcp://*:54001
; socket_type=pub

[delaymanagement]
; Single transmitter setup — SFN synchronisation not needed.
synchronous=0
mutenotimestamps=0
offset=0.250000
